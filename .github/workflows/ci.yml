name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: astroid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations and schema syntax
        run: |
          chmod +x scripts/verify-migrations.sh
          bash scripts/verify-migrations.sh
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/astroid_test?schema=public
          SHADOW_DATABASE_URL: postgresql://postgres:password@localhost:5432/astroid_shadow?schema=public
          CI: "true"

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

  # Fast static verification of the committed migrations: checks that every
  # migration directory contains a non-empty, structurally valid migration.sql
  # and that directory names follow the Prisma naming convention. Runs on every
  # pull request and needs no PostgreSQL connection, so it also catches broken
  # migrations in containerized runners without database services.
  migrations-static:
    name: migrations (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Verify migration files (no database required)
        run: npm run db:verify:static
